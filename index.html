<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>คำนวณเกรด · Leafy GPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="meadow" aria-hidden="true">
    <svg class="meadow__svg" viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path d="M0,60 C240,110 480,10 720,50 C960,90 1200,20 1440,60 L1440,120 L0,120 Z"></path>
    </svg>
  </div>

  <main class="page">

    <header class="header">
      <div class="header__mark">
        <svg viewBox="0 0 48 48" class="leaf-icon" aria-hidden="true">
          <path d="M10 38 C6 24 14 8 34 6 C40 24 34 40 18 42 C14 42.6 11.6 41 10 38 Z"></path>
          <path d="M12 38 C20 30 26 20 33 8" class="leaf-vein"></path>
        </svg>
      </div>
      <div class="header__text">
        <p class="eyebrow">Leafy GPA</p>
        <h1>ตัวคำนวณเกรดเฉลี่ย</h1>
        <p class="subtitle">ใส่รายวิชา หน่วยกิต และคะแนน ระบบจะคำนวณเกรดและ GPA ให้ทันที</p>
      </div>
    </header>

    <section class="card" aria-label="รายวิชา">

      <div class="table-head" role="row">
        <span>รายวิชา</span>
        <span>หน่วยกิต</span>
        <span>คะแนน (0–100)</span>
        <span class="table-head__grade">เกรด</span>
        <span class="table-head__action"></span>
      </div>

      <div id="rows" class="rows"></div>

      <button id="addRow" class="add-btn" type="button">
        <svg viewBox="0 0 20 20" class="add-btn__icon" aria-hidden="true">
          <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        เพิ่มรายวิชา
      </button>

    </section>

    <section class="result" aria-live="polite">
      <div class="result__badge">
        <svg viewBox="0 0 64 64" class="badge-leaf" aria-hidden="true">
          <path d="M12 50 C6 32 16 10 44 8 C52 32 42 52 22 55 C17 55.8 14 54 12 50 Z"></path>
        </svg>
        <span id="letterGrade" class="badge-leaf__letter">–</span>
      </div>
      <div class="result__figures">
        <div class="figure">
          <span class="figure__value" id="gpaValue">0.00</span>
          <span class="figure__label">GPA</span>
        </div>
        <div class="figure figure--muted">
          <span class="figure__value" id="avgValue">0.0</span>
          <span class="figure__label">คะแนนเฉลี่ยถ่วงน้ำหนัก</span>
        </div>
        <div class="figure figure--muted">
          <span class="figure__value" id="creditValue">0</span>
          <span class="figure__label">หน่วยกิตรวม</span>
        </div>
      </div>
    </section>

    <p class="scale-note">
      เกณฑ์: A ≥80 · B+ 75–79 · B 70–74 · C+ 65–69 · C 60–64 · D+ 55–59 · D 50–54 · F &lt;50
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
